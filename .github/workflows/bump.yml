name: Bump version

on:
  workflow_dispatch:
    inputs:
      semver:
        description: "Which SemVer"
        required: true
        default: "patch"
        type: choice
        options:
          - major
          - minor
          - patch
  workflow_call:
    inputs:
      semver:
        description: The SemVer increment to prepare.
        required: true
        type: string
      previous-tag:
        description: The stable release used to select the scheduled increment.
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine the stable release baseline
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: github_releases
        env:
          PREVIOUS_TAG: ${{ inputs.previous-tag }}
        with:
          result-encoding: string
          script: |
            if (process.env.PREVIOUS_TAG) return process.env.PREVIOUS_TAG;
            try {
              const { data } = await github.rest.repos.getLatestRelease(context.repo);
              return data.tag_name;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const { readFileSync } = require('node:fs');
            const source = readFileSync('mix.exs', 'utf8');
            const version = source.match(/version:\s*"(\d+\.\d+\.\d+)/)?.[1];
            if (!version) throw new Error('Unable to determine the current application version');
            return `v${version}`;

      - name: Increment version
        id: get_version
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SEMVER: ${{ inputs.semver }}
          PREVIOUS_TAG: ${{ steps.github_releases.outputs.result }}
        with:
          script: |
            const { incrementVersion } = require('./.github/scripts/select-release-bump.js');
            core.setOutput('NEW_VERSION', incrementVersion(process.env.PREVIOUS_TAG, process.env.SEMVER));

      - name: Generate release notes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: get_release_note
        env:
          NEW_VERSION: ${{steps.get_version.outputs.NEW_VERSION}}
          PREVIOUS_VERSION: ${{ steps.github_releases.outputs.result }}
        with:
          result-encoding: string
          script: |
            const request = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${process.env.NEW_VERSION}`,
              previous_tag_name: process.env.PREVIOUS_VERSION,
              target_commitish: context.sha,
              configuration_file_path: '.github/release.yml',
            };
            let notes;
            try {
              notes = await github.rest.repos.generateReleaseNotes(request);
            } catch (error) {
              // On the first release, PREVIOUS_VERSION comes from mix.exs and
              // has no corresponding Git tag yet. GitHub reports that as 400.
              if (
                error.status !== 400 ||
                !error.message.includes("Invalid previous_tag parameter")
              ) {
                throw error;
              }
              delete request.previous_tag_name;
              notes = await github.rest.repos.generateReleaseNotes(request);
            }
            return notes.data.body;

      - run: |
          printf "## v%s (%s)\n%s\n" "$NEW_VERSION" "$(date '+%Y-%m-%d')" "$RESULT" >> new
        env:
          NEW_VERSION: ${{ steps.get_version.outputs.NEW_VERSION }}
          RESULT: ${{ steps.get_release_note.outputs.result }}
      - name: Update application version
        env:
          NEW_VERSION: ${{ steps.get_version.outputs.NEW_VERSION }}
        run: |
          sed -E -i "s/version: \"[0-9]+\.[0-9]+\.[0-9]+(-dev)?\"/version: \"$NEW_VERSION\"/" mix.exs
      - run: cat new ./CHANGELOG.md > temp
      - run: mv temp ./CHANGELOG.md
      - run: rm new

      - name: Create Pull Request
        id: pull_request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: main
          branch: release
          commit-message: "bump: v${{ steps.get_version.outputs.NEW_VERSION }}"
          body: |
            Prepare v${{ steps.get_version.outputs.NEW_VERSION }} from ${{ github.sha }}.
            The release notes below are generated by GitHub from `.github/release.yml`.

            ${{ steps.get_release_note.outputs.result }}

            <details>
            <summary>日本語</summary>

            ${{ github.sha }} から v${{ steps.get_version.outputs.NEW_VERSION }} を準備する。
            上記のリリースノートは `.github/release.yml` に基づいてGitHubが生成した原文である。

            </details>
          title: "chore: bump v${{ steps.get_version.outputs.NEW_VERSION }}"
          labels: |
            documentation
            Type: Release
          assignees: ${{ github.actor }}
          draft: true
      - name: Verify pull request labels and assignee
        if: steps.pull_request.outputs.pull-request-number != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PULL_NUMBER: ${{ steps.pull_request.outputs.pull-request-number }}
        with:
          script: |
            const { data } = await github.rest.issues.get({
              ...context.repo,
              issue_number: Number(process.env.PULL_NUMBER),
            });
            const labels = data.labels.map(({ name }) => name);
            if (!['documentation', 'Type: Release'].every((label) => labels.includes(label)) ||
                !data.assignees.some(({ login }) => login === context.actor)) {
              core.setFailed('Unable to verify release labels and the workflow actor assignee');
            }
