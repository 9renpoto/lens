name: Bump version

on:
  workflow_dispatch:
    inputs:
      semver:
        description: "Which SemVer"
        required: true
        default: "patch"
        type: choice
        options:
          - major
          - minor
          - patch
  workflow_call:
    inputs:
      semver:
        description: The image_name to build for.
        required: true
        type: string
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: generate new version and save to env variable
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: github_releases
        with:
          result-encoding: string
          script: |
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              },
            );
            if (releases.length > 0) {
              return releases[0].tag_name;
            }

            const file = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: "mix.exs",
            });
            const source = Buffer.from(file.data.content, "base64").toString("utf8");
            const version = source.match(/version:\s*"(\d+\.\d+\.\d+)/)?.[1];
            if (!version) {
              core.setFailed("Unable to determine the current application version");
              return;
            }
            return `v${version}`;

      - name: semver
        id: get_version
        env:
          SEMVER: ${{ inputs.semver }}
          RESULT: ${{ steps.github_releases.outputs.result }}
        run: echo "NEW_VERSION=$(docker run --rm alpine/semver semver -c -i "$SEMVER" "$RESULT")" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: get_release_note
        env:
          NEW_VERSION: ${{steps.get_version.outputs.NEW_VERSION}}
          PREVIOUS_VERSION: ${{ steps.github_releases.outputs.result }}
        with:
          result-encoding: string
          script: |
            const request = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${process.env.NEW_VERSION}`,
              previous_tag_name: process.env.PREVIOUS_VERSION,
            };
            let notes;
            try {
              notes = await github.rest.repos.generateReleaseNotes(request);
            } catch (error) {
              if (error.status !== 404) throw error;
              delete request.previous_tag_name;
              notes = await github.rest.repos.generateReleaseNotes(request);
            }
            return notes.data.body;

      - run: |
          printf "## v%s (%s)\n%s\n" "$NEW_VERSION" "$(date '+%Y-%m-%d')" "$RESULT" >> new
        env:
          NEW_VERSION: ${{ steps.get_version.outputs.NEW_VERSION }}
          RESULT: ${{ steps.get_release_note.outputs.result }}
      - name: Update application version
        env:
          NEW_VERSION: ${{ steps.get_version.outputs.NEW_VERSION }}
        run: |
          sed -E -i "s/version: \"[0-9]+\.[0-9]+\.[0-9]+(-dev)?\"/version: \"$NEW_VERSION\"/" mix.exs
      - run: cat new ./CHANGELOG.md > temp
      - run: mv temp ./CHANGELOG.md
      - run: rm new

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: main
          branch: release
          commit-message: "bump: v${{ steps.get_version.outputs.NEW_VERSION }}"
          body: ${{ steps.get_release_note.outputs.result  }}
          title: "chore: bump v${{ steps.get_version.outputs.NEW_VERSION }}"
          labels: |
            documentation
          draft: true
          milestone: "v${{ steps.get_version.outputs.NEW_VERSION }}"

  tag:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'release' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - name: Read release version
        id: version
        run: |
          version=$(sed -nE 's/.*version: "([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' mix.exs)
          if [[ -z "$version" ]]; then
            echo "Unable to determine the release version" >&2
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release and dispatch image publication
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        with:
          script: |
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.RELEASE_TAG,
              target_commitish: process.env.MERGE_SHA,
              name: process.env.RELEASE_TAG,
              generate_release_notes: true,
            });
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "ci.yml",
              ref: process.env.RELEASE_TAG,
            });
