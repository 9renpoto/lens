name: Elixir CI

on:
  pull_request:
    paths:
      - "**/*.ex"
      - "**/*.exs"
      - "mix.lock"
      - "**/*.c"
      - "**/*.h"
      - "Dockerfile"
      - ".github/workflows/**"
  push:
    branches: [main]
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  test:
    # ubuntu-slim is unprivileged and cannot host the PostgreSQL service container.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    services:
      rustfs:
        image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
        env:
          RUSTFS_ACCESS_KEY: lens-storage-test
          RUSTFS_SECRET_KEY: lens-storage-test-secret
          RUSTFS_CONSOLE_ENABLE: "false"
          RUSTFS_OBS_LOGGER_LEVEL: error
        ports:
          - 9000:9000
      postgres:
        image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lens_test
        options: >-
          --health-cmd "pg_isready -U postgres -d lens_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      MIX_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lens_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.18.3"
          otp-version: "27.3.4"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _build/test/dialyxir_*.plt*
          key: dialyzer-${{ runner.os }}-otp-27.3.4-elixir-1.18.3-${{ hashFiles('mix.exs', 'mix.lock') }}
          lookup-only: true
      - run: mix deps.get
      - name: Verify production repository configuration needs no endpoint secret
        run: env -u SECRET_KEY_BASE MIX_ENV=prod DATABASE_URL=ecto://lens:unused@localhost/lens mix app.config
      - name: Install PDF extraction tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y poppler-utils poppler-data
      - name: Build and verify native PDF runner
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror priv/pdf_runner.c -o priv/pdf_runner
          test/pdf_native_runner_check.sh
      - run: node --test .github/scripts/prune-package-versions.test.js
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - name: Verify RustFS create-only storage and exact bytes
        env:
          LENS_RUSTFS_ENDPOINT: http://127.0.0.1:9000
          LENS_RUSTFS_BUCKET: lens-test
          LENS_RUSTFS_ACCESS_KEY_ID: lens-storage-test
          LENS_RUSTFS_SECRET_ACCESS_KEY: lens-storage-test-secret
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 1 http://127.0.0.1:9000/health > /dev/null; then
              break
            fi
            echo "Waiting for RustFS ($attempt/30)"
            sleep 1
          done
          curl --fail --silent --max-time 1 http://127.0.0.1:9000/health
          mix run --no-start test/system/rustfs_storage_check.exs
      - name: Verify durable RustFS recovery and competing workers
        env:
          POSTGRES_DB: lens_storage_recovery_test
          LENS_RUSTFS_ENDPOINT: http://127.0.0.1:9000
          LENS_RUSTFS_BUCKET: lens-test
          LENS_RUSTFS_ACCESS_KEY_ID: lens-storage-test
          LENS_RUSTFS_SECRET_ACCESS_KEY: lens-storage-test-secret
        run: |
          mix ecto.create
          mix run --no-start test/system/earnings_storage_recovery_check.exs
      - run: elixir -pa "_build/test/lib/*/ebin" test/pdf_adapter_check.exs
      - name: Verify search migration over existing large earnings text
        env:
          POSTGRES_DB: lens_search_migration_test
        run: |
          mix ecto.create
          mix run --no-start test/system/earnings_search_migration_check.exs
      - name: Verify storage downgrade fences live writers
        env:
          POSTGRES_DB: lens_storage_downgrade_test
        run: |
          mix ecto.create
          mix run --no-start test/system/earnings_storage_downgrade_check.exs
      - run: mix dialyzer
      - name: Verify source registration migration preserves existing history
        env:
          POSTGRES_DB: lens_source_migration_test
        run: |
          mix ecto.create
          mix run --no-start test/system/earnings_source_migration_check.exs
      - run: mix coveralls.lcov
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: cover/lcov.info
          fail_ci_if_error: true
          use_oidc: true

  publish:
    needs: test
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-production-image
      cancel-in-progress: false
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi
      - name: Reject an existing release tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          script: |
            const versions = await github.paginate(
              github.rest.packages.getAllPackageVersionsForPackageOwnedByUser,
              {
                package_type: "container",
                package_name: context.repo.repo,
                username: context.repo.owner,
                per_page: 100,
              },
            );
            const alreadyPublished = versions.some((version) =>
              (version.metadata?.container?.tags ?? []).includes(process.env.RELEASE_TAG)
            );
            if (alreadyPublished) {
              core.setFailed(`Release tag already exists: ${process.env.RELEASE_TAG}`);
            }
      - name: Select image tags
        id: image_tags
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "tags<<EOF"
          if [[ "$REF_TYPE" == "tag" ]]; then
              echo "$IMAGE_NAME:$REF_NAME"
              echo "$IMAGE_NAME:latest"
          else
              echo "$IMAGE_NAME:latest"
          fi
            echo "$IMAGE_NAME:sha-$SHA"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.image_tags.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { prunePackageVersions } = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/prune-package-versions.js`,
            );
            await prunePackageVersions({ github, context });
