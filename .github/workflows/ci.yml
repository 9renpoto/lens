name: Elixir CI

on:
  # Keep PR checks observable; select expensive jobs from changed inputs.
  pull_request:
  push:
    branches: [main]
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      test: ${{ steps.changes.outputs.test }}
      image: ${{ steps.changes.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node --test .github/scripts/*.test.js
      - name: Detect changed inputs
        id: changes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { detectChanges } = require('./.github/scripts/ci-changes.js');
            const changes = await detectChanges({ github, context, core });
            for (const [name, changed] of Object.entries(changes)) {
              core.setOutput(name, String(changed));
            }

  test:
    needs: checks
    if: >-
      !cancelled() && needs.checks.result == 'success' &&
      needs.checks.outputs.test == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/test-elixir.yml # zizmor: ignore[self-repository] pinned actionlint does not yet parse GitHub's $/ syntax

  octocov:
    needs: test
    if: >-
      !cancelled() && needs.test.result == 'success' &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report
          path: cover
      - uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2
        with:
          version: v0.83.1
          checksum: 8e9980e02a2713d0335d9928761b2bfa111c6f9ff879252dc2b11e0bd712e332
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main'
        with:
          name: coverage-badge
          path: cover/coverage.svg
          if-no-files-found: error

  publish:
    needs: [checks, test]
    if: >-
      !cancelled() && needs.test.result == 'success' &&
      needs.checks.outputs.image == 'true' && github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-production-image
      cancel-in-progress: false
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi
      - name: Reject an existing release tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          script: |
            const versions = await github.paginate(
              github.rest.packages.getAllPackageVersionsForPackageOwnedByUser,
              {
                package_type: "container",
                package_name: context.repo.repo,
                username: context.repo.owner,
                per_page: 100,
              },
            );
            const alreadyPublished = versions.some((version) =>
              (version.metadata?.container?.tags ?? []).includes(process.env.RELEASE_TAG)
            );
            if (alreadyPublished) {
              core.setFailed(`Release tag already exists: ${process.env.RELEASE_TAG}`);
            }
      - name: Select image tags
        id: image_tags
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "tags<<EOF"
          if [[ "$REF_TYPE" == "tag" ]]; then
              echo "$IMAGE_NAME:$REF_NAME"
              echo "$IMAGE_NAME:latest"
          else
              echo "$IMAGE_NAME:latest"
          fi
            echo "$IMAGE_NAME:sha-$SHA"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.image_tags.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { prunePackageVersions } = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/prune-package-versions.js`,
            );
            await prunePackageVersions({ github, context });

  build-pages:
    needs: octocov
    if: >-
      !cancelled() && needs.octocov.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api-site
          path: _site
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-badge
          path: _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  publish-pages:
    needs: build-pages
    if: >-
      !cancelled() && needs.build-pages.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: publish-api-documentation
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  ci-result:
    name: CI result
    needs: [checks, test, octocov]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    env:
      CHECKS_RESULT: ${{ needs.checks.result }}
      TEST_REQUIRED: ${{ needs.checks.outputs.test }}
      TEST_RESULT: ${{ needs.test.result }}
      COVERAGE_RESULT: ${{ needs.octocov.result }}
    steps:
      - name: Require all applicable checks to succeed
        run: |
          test "$CHECKS_RESULT" = success
          if [ "$TEST_REQUIRED" = true ]; then
            test "$TEST_RESULT" = success
            if [ "$GITHUB_REF_TYPE" != tag ]; then
              test "$COVERAGE_RESULT" = success
            fi
          fi
