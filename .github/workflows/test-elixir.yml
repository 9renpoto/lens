name: Elixir tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    # ubuntu-slim is unprivileged and cannot host the PostgreSQL service container.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      rustfs:
        image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
        env:
          RUSTFS_ACCESS_KEY: lens-storage-test
          RUSTFS_SECRET_KEY: lens-storage-test-secret
          RUSTFS_CONSOLE_ENABLE: "false"
          RUSTFS_OBS_LOGGER_LEVEL: error
        ports:
          - 9000:9000
      postgres:
        image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lens_test
        options: >-
          --health-cmd "pg_isready -U postgres -d lens_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      MIX_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lens_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.18.3"
          otp-version: "27.3.4"
      - run: mix deps.get
      - name: Verify production repository configuration needs no endpoint secret
        run: env -u SECRET_KEY_BASE MIX_ENV=prod DATABASE_URL=ecto://lens:unused@localhost/lens mix app.config
      - name: Install PDF extraction tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y poppler-utils poppler-data
      - name: Build and verify native PDF runner
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror priv/pdf_runner.c -o priv/pdf_runner
          test/pdf_native_runner_check.sh
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - name: Verify RustFS create-only storage and exact bytes
        env:
          LENS_RUSTFS_ENDPOINT: http://127.0.0.1:9000
          LENS_RUSTFS_BUCKET: lens-test
          LENS_RUSTFS_ACCESS_KEY_ID: lens-storage-test
          LENS_RUSTFS_SECRET_ACCESS_KEY: lens-storage-test-secret
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 1 http://127.0.0.1:9000/health > /dev/null; then
              break
            fi
            echo "Waiting for RustFS ($attempt/30)"
            sleep 1
          done
          curl --fail --silent --max-time 1 http://127.0.0.1:9000/health
          mix run --no-start test/system/rustfs_storage_check.exs
      - name: Verify synchronous RustFS acquisition
        env:
          POSTGRES_DB: lens_synchronous_storage_test
          LENS_RUSTFS_ENDPOINT: http://127.0.0.1:9000
          LENS_RUSTFS_BUCKET: lens-test
          LENS_RUSTFS_ACCESS_KEY_ID: lens-storage-test
          LENS_RUSTFS_SECRET_ACCESS_KEY: lens-storage-test-secret
        run: |
          mix ecto.create
          mix run --no-start test/system/earnings_synchronous_storage_check.exs
      - run: elixir -pa "_build/test/lib/*/ebin" test/pdf_adapter_check.exs
      - name: Verify concurrent original persistence
        env:
          POSTGRES_DB: lens_concurrent_storage_test
        run: |
          mix ecto.create
          mix run --no-start test/system/earnings_concurrent_storage_check.exs
      - run: mix dialyzer
      - run: mix coveralls.lcov
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: cover/lcov.info
          if-no-files-found: error
      - name: Generate API documentation from the compiled application
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: |
          mkdir _site
          mix openapi.spec.json --spec LensWeb.ApiSpec --pretty --start-app=false --filename _site/openapi.json
          cp docs/api/index.html _site/index.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main'
        with:
          name: api-site
          path: _site
          if-no-files-found: error
