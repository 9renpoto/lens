services:
  postgres:
    image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
    environment:
      POSTGRES_DB: lens
      POSTGRES_USER: lens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lens -d lens"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    image: ghcr.io/9renpoto/lens:latest
    pull_policy: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ecto://lens:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres/lens
      PHX_HOST: ${PHX_HOST:-localhost}
      PORT: "4000"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set SECRET_KEY_BASE}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:4000/api/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    ports:
      - "127.0.0.1:${LENS_PORT:-4000}:4000"
    restart: unless-stopped

volumes:
  postgres_data:
