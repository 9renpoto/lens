services:
  postgres:
    image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    environment:
      POSTGRES_DB: lens
      POSTGRES_USER: lens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lens -d lens"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql

  app:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ecto://lens:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres/lens
      PHX_HOST: ${PHX_HOST:-localhost}
      PORT: "4000"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set SECRET_KEY_BASE}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:4000/api/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    ports:
      - "127.0.0.1:${LENS_PORT:-4000}:4000"
    restart: unless-stopped

volumes:
  postgres_data:
